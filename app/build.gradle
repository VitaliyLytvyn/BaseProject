apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
apply plugin: 'androidx.navigation.safeargs'
apply plugin: 'kotlin-kapt'

apply plugin: 'io.fabric'

android {
    compileSdkVersion 28
    defaultConfig {
        applicationId "com.skyver.trybase"
        minSdkVersion 17
        targetSdkVersion 28
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled true

    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test:runner:1.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'

    //kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"

    //platform
    implementation "com.google.android.material:material:$rootProject.materialVersion"
    implementation 'androidx.appcompat:appcompat:' + rootProject.supportVersion
    implementation 'androidx.recyclerview:recyclerview:' + rootProject.supportVersion
    implementation 'androidx.constraintlayout:constraintlayout:' + rootProject.constraintLayoutVersion
    implementation 'androidx.lifecycle:lifecycle-extensions:2.0.0'
    //implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.0.0"

    //multidex if minSdkVersion <= 20
    implementation 'androidx.multidex:multidex:2.0.1'

    // Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:' + rootProject.navigationVersion
    implementation 'androidx.navigation:navigation-ui-ktx:' + rootProject.navigationVersion

    //Timber logging
    implementation 'com.jakewharton.timber:timber:4.7.1'

    //dagger
    implementation 'com.google.dagger:dagger:2.24'
    kapt 'com.google.dagger:dagger-compiler:2.24'

    //Glide
    implementation 'com.github.bumptech.glide:glide:4.0.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.8.0'

    //room
//    kapt 'androidx.room:room-compiler:2.0.0'
//    implementation 'androidx.room:room-runtime:2.0.0'

    //retrofit + okhttp
    implementation 'com.squareup.retrofit2:retrofit:2.6.0'
    implementation "com.squareup.retrofit2:converter-gson:2.6.0"
    implementation 'com.squareup.okhttp3:okhttp:3.12.0' //for min version < 21(Android 5.0) NO upgrade to 3.13
    implementation 'com.squareup.retrofit2:adapter-rxjava2:2.6.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:3.12.1'

    // Crashlytics  dependency
    implementation 'com.crashlytics.sdk.android:crashlytics:2.10.1'

    //Firebase
    implementation 'com.google.firebase:firebase-core:17.0.1'
    //Firebase UI Auth todo consider choose either firebase-auth or firebase-ui-auth only
    implementation 'com.firebaseui:firebase-ui-auth:4.2.1'
    // Required only if Facebook login support is required
    // Find the latest Facebook SDK releases here: https://goo.gl/Ce5L94
    implementation 'com.facebook.android:facebook-login:[4,5)'
    // Required only if Twitter login support is required
    // Find the latest Twitter SDK releases here: https://goo.gl/E5wZvQ
    implementation 'com.twitter.sdk.android:twitter-core:3.3.0'
    //firestore
    implementation 'com.google.firebase:firebase-firestore:20.2.0'
    //firebase dynamic links
    implementation 'com.google.firebase:firebase-dynamic-links:18.0.0'

    //Firebase NOT UI Auth todo consider choose either firebase-auth or firebase-ui-auth only
    implementation 'com.google.firebase:firebase-auth:18.1.0'
    implementation 'com.google.android.gms:play-services-auth:17.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'

    //Runtime permissions
    implementation 'pub.devrel:easypermissions:3.0.0'
}

apply plugin: 'com.google.gms.google-services'
